name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar release formal con el APK adjunto'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Nombre de la versión (ej. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21 con Caching de Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configurar Entorno Android SDK y Licencias
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          
          # Habilitar permisos de escritura en carpetas requeridas
          sudo mkdir -p "$SDK_DIR/licenses" "$SDK_DIR/platforms" 2>/dev/null || mkdir -p "$SDK_DIR/licenses" "$SDK_DIR/platforms"
          sudo chmod -R 777 "$SDK_DIR/licenses" "$SDK_DIR/platforms" 2>/dev/null || true

          # Escribir hashes de licencias oficiales del SDK
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" | sudo tee "$SDK_DIR/licenses/android-sdk-license" > /dev/null
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$SDK_DIR/licenses/android-sdk-preview-license" > /dev/null
          printf "d97546511b248a39df35309e688836e4e65cb576\n" | sudo tee "$SDK_DIR/licenses/android-sdk-arm-dbt-license" > /dev/null
          
          # Configurar local.properties para asegurar detección de SDK
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "sdk.dir=$SDK_DIR" > app/local.properties
          echo "Android SDK y licencias configurados exitosamente en $SDK_DIR"

      - name: Preparar variables de entorno (.env)
        run: |
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Preparar Keystore de depuración (debugConfig)
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -s debug.keystore ]; then
            echo "Decodificando debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generando debug.keystore con keytool..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Preparar script ejecutable gradlew
        run: |
          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew
          fi

      - name: Compilar APK optimizado con Gradle
        run: |
          bash ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Preparar y verificar APK generado
        run: |
          mkdir -p build/dist-apk
          APK_FOUND=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find . -type f -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FOUND" ] && [ -f "$APK_FOUND" ]; then
            cp "$APK_FOUND" build/dist-apk/HotelRivera-v1.0.apk
            echo "APK generado y preparado en: build/dist-apk/HotelRivera-v1.0.apk"
            ls -lh build/dist-apk/HotelRivera-v1.0.apk
          else
            echo "Error: No se encontró ningún archivo APK generado"
            exit 1
          fi

      - name: Subir APK como Artefacto descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: HotelRivera-Android-APK
          path: build/dist-apk/HotelRivera-v1.0.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Publicar APK en GitHub Release (si es tag o solicitado)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.create_release == 'true' && startsWith(github.event.inputs.tag_name, 'v'))
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Hotel Rivera ${{ github.event.inputs.tag_name || github.ref_name }}"
          body: |
            ### 📱 Hotel Rivera — Instalador de Aplicación Android (APK)

            Esta versión contiene el instalador APK listo para su descarga e instalación en teléfonos y tablets Android.

            #### Instrucciones de Instalación:
            1. Descarga el archivo **`HotelRivera-v1.0.apk`** que se encuentra abajo en los recursos adjuntos (*Assets*).
            2. Transfiere o abre el archivo en tu dispositivo Android.
            3. Si el sistema lo solicita, autoriza "Instalar aplicaciones de fuentes desconocidas".
            4. Abre la aplicación e inicia sesión con la cuenta de Google del hotel.
          files: build/dist-apk/HotelRivera-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
